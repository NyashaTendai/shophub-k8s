apiVersion: batch/v1
kind: Job
metadata:
  name: shophub-migrate
  namespace: shophub
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: shophub:2.0
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "flask --app app db upgrade && flask --app app seed"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: shophub-db
                  key: DATABASE_URL