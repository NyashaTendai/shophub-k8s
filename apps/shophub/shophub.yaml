apiVersion: v1
kind: Service
metadata:
  name: shophub
  namespace: shophub
spec:
  selector:
    app: shophub
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shophub
  namespace: shophub
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shophub
  template:
    metadata:
      labels:
        app: shophub
        tier: app
    spec:
      containers:
        - name: shophub
          image: shophub:2.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: shophub-db
                  key: DATABASE_URL
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi